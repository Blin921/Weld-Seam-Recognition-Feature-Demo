<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="焊缝识别系统离线交互演示，内置合成数据，无需安装或联网。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>焊缝识别系统 · 离线演示</title>
<style>:root {
  font-family: Arial, "Microsoft YaHei", sans-serif;
  color: #26354b;
  background: #f3f5f9;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
a {
  color: inherit;
  text-decoration: none;
}
input,
textarea,
select {
  border: 1px solid #dce2eb;
  border-radius: 6px;
  padding: 8px;
  background: var(--surface);
  color: inherit;
  min-width: 0;
}
input[type="checkbox"] {
  accent-color: #3478f6;
  width: 17px;
  height: 17px;
}
input[type="range"] {
  accent-color: #4a8af8;
  padding: 0;
}
textarea {
  width: 100%;
  font-family: monospace;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid #3981ff;
}
.workstation {
  --surface: #fff;
  --muted: #7c8a9e;
  --line: #e7ecf3;
  --soft: #f7f9fc;
  background: #f3f5f9;
  min-width: 1000px;
  min-height: 100vh;
}
.dark {
  --surface: #182332;
  --muted: #95a5ba;
  --line: #2b3b50;
  --soft: #1c293a;
  background: #101923 !important;
  color: #e0e8f4;
}
header {
  height: 78px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 28px;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1px;
}
.brand-icon {
  background: #2c72ef;
  border-radius: 10px;
  color: white;
  padding: 10px;
  display: flex;
}
.brand span {
  color: #3179ef;
  margin-left: 4px;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--muted);
  margin-top: 5px;
}
.workspace-name {
  border-left: 1px solid var(--line);
  padding-left: 26px;
  font-size: 13px;
  color: var(--muted);
}
.workspace-name span {
  padding: 0 12px;
  color: #c3ccd8;
}
.health {
  margin-left: auto;
  display: flex;
  gap: 9px;
  font-size: 12px;
}
.health > span {
  padding: 7px 10px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--soft);
}
i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.ok {
  color: #149c79;
}
.warn {
  color: #c58b29;
}
.danger {
  color: #d76161;
}
.icon-button {
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex;
}
.page-heading {
  padding: 27px 28px 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  color: #8494aa;
  font-weight: 600;
}
h1 {
  font-size: 25px;
  margin: 8px 0 9px;
}
h1 span {
  font-size: 11px;
  color: #357aeb;
  background: #e6eefc;
  border: 1px solid #d5e3fc;
  border-radius: 4px;
  margin-left: 10px;
  padding: 3px 6px;
  vertical-align: middle;
  font-weight: 400;
}
.page-heading p {
  color: var(--muted);
  margin: 0;
  font-size: 13px;
}
.safety-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #698098;
  font-size: 12px;
  padding: 10px 14px;
  border: 1px solid #dce5ee;
  border-radius: 7px;
}
.steps {
  display: flex;
  margin: 0 28px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 18px;
}
.steps > button {
  flex: 1;
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--muted);
  padding: 7px;
}
.step-number {
  font: 12px monospace;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
}
.steps .active {
  color: #2873ed;
  font-weight: 600;
}
.active .step-number {
  color: white;
  background: #347cf3;
  border-color: #347cf3;
}
.step-line {
  height: 1px;
  background: var(--line);
  flex: 1;
  margin: 0 12px;
}
.steps button:last-child .step-line {
  display: none;
}
.steps b {
  font-size: 10px;
  background: #fff1d7;
  color: #bb862b;
  padding: 1px 5px;
  border-radius: 50%;
}
.panels {
  margin: 0 28px;
  display: grid;
  grid-template-columns: 320px minmax(600px, 1fr) 300px;
  gap: 16px;
  height: 640px;
}
.control-panel,
.context-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  min-height: 51px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.panel-title > svg {
  color: #3c7fea;
}
.panel-title > span {
  margin-left: auto;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 400;
}
.control-content {
  padding: 18px;
  overflow: auto;
  flex: 1;
}
.context-content {
  padding: 18px;
  overflow: auto;
}
.panel-bottom {
  padding: 13px 16px;
  background: var(--soft);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 7px;
  align-items: center;
}
h3 {
  font-size: 14px;
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}
h3 > span {
  font-size: 10px;
  font-weight: 400;
  margin-left: auto;
  color: var(--muted);
}
.upload {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 20px;
  border: 1px dashed #afc9f0;
  background: var(--soft);
  border-radius: 7px;
  color: #4681db;
  cursor: pointer;
}
.upload strong {
  font-size: 13px;
  font-weight: 500;
}
.upload small {
  font-size: 11px;
  color: var(--muted);
}
.upload input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  cursor: pointer;
}
.frame-list {
  margin-top: 13px;
  max-height: 180px;
  overflow: auto;
}
.frame-list > button {
  display: flex;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px 9px;
  gap: 9px;
  align-items: center;
  margin-bottom: 7px;
}
.frame-list > button.chosen {
  border-color: #659df9;
  background: #347cf30b;
}
.frame-list strong {
  font: 13px monospace;
}
.frame-list small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.artifact {
  margin-left: auto;
  color: #249a79;
  background: #22b38913;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
}
.section-divider {
  border-top: 1px solid var(--line);
  margin: 20px 0;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  margin: 15px 0;
}
.toggle-row small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
}
details {
  font-size: 12px;
}
summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 0;
  color: var(--muted);
}
summary > svg:last-child {
  margin-left: auto;
}
.full {
  width: 100%;
  justify-content: center;
  margin-top: 12px;
}
.primary,
.secondary {
  border-radius: 6px;
  padding: 11px 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary {
  background: #347af0;
  color: white;
}
.secondary {
  border: 1px solid var(--line);
  background: var(--soft);
}
.camera {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 10px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 9px;
  margin: 12px 0;
}
.fields label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}
.fields input {
  width: 100%;
  color: inherit;
  font-family: monospace;
}
.fields input[type="checkbox"] {
  width: 17px;
}
.help {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}
.info-box,
.warning {
  font-size: 14px;
  line-height: 1.8;
  border: 1px solid #dce7f5;
  background: var(--soft);
  padding: 12px;
  border-radius: 7px;
  margin: 12px 0;
}
.warning {
  border-color: #eedcb6;
  background: #f9b63912;
  color: #bc8428;
}
.danger-box {
  color: #da6262;
  border-color: #d963633d;
  background: #d963630a;
}
.text-danger {
  color: #d96363;
  padding: 12px 0;
}
.pair-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 9px 0 16px;
}
.pair-grid input {
  width: 100%;
  padding: 7px;
}
.pair-list h4 {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}
.pair-list h4 button {
  font-size: 11px;
  color: #cb7373;
}
.pair-list small {
  font-size: 10px;
  color: var(--muted);
}
.code-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  align-items: center;
}
.code-header a {
  display: flex;
  gap: 4px;
  color: #3a7de8;
}
.program-code {
  background: #101923;
  color: #b3c9df;
  padding: 12px;
  overflow: auto;
  max-height: 240px;
  font-size: 11px;
}
.viewport {
  border-radius: 9px;
  position: relative;
  overflow: hidden;
  background: #0d1218;
  color: #a6b6c8;
  min-width: 600px;
  border: 1px solid #24303d;
}
.view-toolbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  background: #121a24e0;
  border-bottom: 1px solid #273341;
}
.view-toolbar > div:first-child {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: #647b8e;
}
.view-toolbar strong {
  color: #dce6f2;
  font-size: 14px;
  font-weight: 500;
  margin-right: 9px;
}
.live-dot {
  width: 5px;
  height: 5px;
  background: #2ca893;
  border-radius: 50%;
}
.view-switch {
  background: #0b121c;
  border: 1px solid #283441;
  border-radius: 5px;
  padding: 3px;
  display: flex;
}
.view-switch button {
  padding: 5px 13px;
  font-size: 12px;
  color: #7e91a6;
  border-radius: 3px;
}
.view-switch .active {
  background: #29384b;
  color: #dae6f7;
}
.cloud-canvas {
  position: absolute;
  inset: 52px 0 32px;
}
.cloud-canvas[data-error]:after {
  content: attr(data-error);
  position: absolute;
  top: 50%;
  left: 20px;
  color: #eaa;
}
.cloud-canvas canvas {
  display: block;
}
.viewport-empty {
  pointer-events: none;
  position: absolute;
  inset: 52px 0 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #18283c66, transparent 65%);
}
.empty-orbit {
  color: #678fc2;
  border: 1px solid #344960;
  border-radius: 50%;
  padding: 32px;
  box-shadow:
    0 0 0 25px #24334620,
    0 0 0 50px #2433460c;
  margin-bottom: 30px;
}
.viewport-empty h2 {
  font-size: 18px;
  font-weight: 400;
  color: #c6d3e4;
}
.viewport-empty p {
  font-size: 14px;
  color: #6c8098;
}
.viewport-empty > span {
  font: 9px monospace;
  letter-spacing: 2px;
  margin-top: 18px;
  color: #41576f;
}
.view-controls {
  position: absolute;
  top: 67px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
}
.view-controls label {
  display: flex;
  gap: 7px;
  align-items: center;
  background: #15202be0;
  padding: 7px;
  border: 1px solid #283848;
  border-radius: 4px;
}
.view-controls input {
  width: 60px;
}
.view-controls button {
  display: flex;
  gap: 5px;
  padding: 8px;
  background: #15202be0;
  border: 1px solid #283848;
  border-radius: 4px;
}
.legend {
  position: absolute;
  bottom: 48px;
  left: 19px;
  display: flex;
  gap: 15px;
  font-size: 14px;
}
.legend span {
  display: flex;
  gap: 5px;
  align-items: center;
}
.legend i {
  border-radius: 2px;
}
.view-status {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 32px;
  border-top: 1px solid #273341;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  font: 10px monospace;
  background: #101923;
}
.view-status span:first-child {
  color: #92b6e6;
}
.context-summary {
  display: flex;
  background: var(--soft);
  padding: 17px 12px;
  border-radius: 7px;
  gap: 15px;
  margin-bottom: 23px;
}
.context-summary > div {
  flex: 1;
}
.context-summary > div + div {
  border-left: 1px solid var(--line);
  padding-left: 15px;
}
.context-summary strong {
  font: 23px monospace;
}
.context-summary em {
  font-size: 10px;
  font-style: normal;
  color: var(--muted);
}
.context-summary small {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-top: 6px;
}
.seam-card {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px;
  margin-bottom: 10px;
}
.seam-card.selected {
  border-color: #6fa2f9;
  background: #347cf308;
}
.seam-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0;
  font-size: 14px;
}
.seam-title > span {
  display: flex;
  gap: 7px;
  align-items: center;
}
.seam-title i {
  color: #2bbdc5;
}
.selected .seam-title i {
  color: #e4af44;
}
.seam-title strong {
  font: 12px monospace;
}
.seam-title small {
  font-size: 9px;
  color: var(--muted);
}
.seam-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 10px 0;
}
.seam-card p span {
  margin: 0 6px;
}
.seam-actions {
  display: flex;
  border-top: 1px solid var(--line);
  padding-top: 9px;
  justify-content: space-between;
}
.seam-actions button {
  font-size: 12px;
  color: #4e82d5;
  padding: 0 4px;
}
.empty-small {
  font-size: 14px;
  line-height: 1.9;
  color: var(--muted);
  padding: 16px 4px;
}
.context-panel dl {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  font-size: 14px;
  margin: 20px 0;
}
.context-panel dt {
  color: var(--muted);
}
.context-panel dd {
  margin: 0;
  text-align: right;
  font-family: monospace;
}
.tip {
  display: flex;
  gap: 9px;
  background: var(--soft);
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: #5484c6;
  margin-top: 25px;
}
.tip svg {
  flex-shrink: 0;
}
.tip p {
  font-size: 14px;
  margin: 0;
}
.tip small {
  display: block;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.8;
  margin-top: 7px;
}
.playback {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 16px 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 15px 18px;
}
.playback > div {
  display: flex;
  align-items: center;
  gap: 9px;
}
.playback strong {
  font-size: 14px;
  white-space: nowrap;
}
.playback span {
  font-size: 12px;
  color: var(--muted);
  margin: 0 15px 0 5px;
}
.playback > button {
  display: flex;
  align-items: center;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
}
.playback > input {
  flex: 1;
}
.playback code {
  font-size: 11px;
  color: var(--muted);
  min-width: 115px;
}
.playback select {
  padding: 5px;
  font-size: 11px;
}
.task-drawer {
  margin: 0 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.drawer-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 18px;
  text-align: left;
}
.drawer-heading strong {
  font-size: 14px;
}
.drawer-heading span {
  font-size: 14px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 14px;
}
.drawer-heading small {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}
.task-body {
  height: 190px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 300px 1fr;
  background: #111a25;
  color: #869bb4;
}
.task-history {
  padding: 14px 18px;
  overflow: auto;
  border-right: 1px solid #293545;
  font-size: 14px;
}
.task-history pre {
  white-space: pre-wrap;
  font: 12px monospace;
  line-height: 1.7;
}
.task-history summary span {
  margin-left: auto;
}
.event-log {
  white-space: pre-wrap;
  overflow: auto;
  margin: 0;
  padding: 18px;
  font: 12px/1.9 monospace;
}
footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 30px;
  font-size: 11px;
  color: #8c9bad;
}
footer span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;
}
footer i {
  color: #39a58c;
}
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 700px;
  padding: 15px 20px;
  background: #1b2e46;
  color: white;
  border: 1px solid #496180;
  box-shadow: 0 8px 35px #0003;
  border-radius: 8px;
  z-index: 20;
  font-size: 14px;
  line-height: 1.6;
}
.toast button {
  margin-left: 15px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #07101bb0;
  z-index: 30;
  display: grid;
  place-items: center;
  backdrop-filter: blur(5px);
}
.modal {
  background: var(--surface);
  padding: 30px;
  border-radius: 13px;
  width: 440px;
  border: 1px solid var(--line);
}
.modal > svg {
  color: #d59635;
}
.modal h2 {
  font-size: 20px;
}

/* Fit the workspace to the browser viewport; long forms scroll inside panels. */
.workstation {

  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.workstation > * {
  flex-shrink: 0;
}
.workstation > .site-header {

  padding-bottom: 0;
}

}

}

}
.workstation > .panels {
  height: auto;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.workstation .control-panel,
.workstation .context-panel {
  min-height: 0;
}
.workstation .control-content,
.workstation .context-content {
  min-height: 0;

}
.workstation .context-content {

}
.workstation .panel-title {

  padding-top: 12px;
  padding-bottom: 8px;

}
.workstation .control-content {
  padding-top: 8px;
}
.workstation > .playback {

}
.workstation > .task-drawer {

}
.workstation .drawer-heading {
  padding: 10px 16px;
  min-height: 40px;
}

.workstation .task-body {

.workstation > .workflow-pager,
.workstation > footer {

.workstation > .demo-banner button {

}
.workstation > .connection-warning {

}
.workstation .view-toolbar {

}
.workstation .cloud-canvas,
.workstation .viewport-empty {

}
.workstation .view-controls {

.workstation .view-status {

/* Calibration presentation changes are limited to the existing side panels. */
.calibration-intro {
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
  margin: 0 0 16px;
}
.calibration-frame {
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 14px;
  font-weight: 600;
}
.calibration-frame select {
  width: 100%;
  font-family: var(--numeric-font);
  background: var(--soft);
  border: 1px solid var(--line);
  font-weight: 400;
  min-height: 40px;
}
.calibration-flow {
  list-style: none;
  margin: 16px 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.calibration-flow li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.calibration-flow li > span {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--muted);
  background: var(--soft);
  font-family: var(--numeric-font);
}
.calibration-flow strong {
  display: block;
  font-size: 14px;
  line-height: 1.6;
}
.calibration-flow p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--muted);
  margin: 4px 0 0;
}
.calibration-flow .current > span {
  background: #347af0;
  color: white;
}
.calibration-flow .complete > span {
  background: #e1f3ec;
  color: #008d81;
}
.calibration-flow .needs-review > span {
  background: #fff0d7;
  color: #ad701d;
}
.calibration-note {
  font-size: 14px;
  line-height: 1.7;
  color: var(--muted);
  margin: 10px 0;
}
.calibration-advanced {
  margin-top: 14px;
  border-top: 1px solid var(--line);
  padding-top: 6px;
}
.calibration-advanced summary {
  padding: 12px 0;
  line-height: 1.6;
  font-size: 14px;
  color: var(--muted);
}
.calibration-advanced[open] summary {
  color: #347af0;
}
.calibration-editor textarea {
  font-family: var(--numeric-font);
}
.calibration-technical {
  font-size: 14px;
  margin: 14px 0;
}
.calibration-technical dt {
  color: var(--muted);
  margin-top: 10px;
}
.calibration-technical dd {
  font-family: var(--numeric-font);
  margin: 5px 0 0;
  overflow-wrap: anywhere;
}
.calibration-results {
  padding-top: 6px;
}
.calibration-result-icon {
  width: 44px;
  height: 44px;
  margin: 0 0 12px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e1f3ec;
  color: #008d81;
}
.calibration-result-icon.pending {
  color: #92a2b5;
  background: var(--soft);
}
.calibration-result-icon.needs-review {
  background: #fff0d7;
  color: #ad701d;
}
.calibration-results h2 {
  font-size: 18px;
  line-height: 1.5;
  margin: 0 0 8px;
}
.calibration-result-caption {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  margin: 0 0 14px;
}
.calibration-metrics {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin: 14px 0;
}
.calibration-metric {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--soft);
  border: 1px solid var(--line);
}
.calibration-metric > span {
  color: var(--muted);
  font-size: 14px;
}
.calibration-metric > strong {
  font-family: var(--numeric-font);
  font-size: 21px;
  white-space: nowrap;
}
.calibration-metric small {
  font-weight: 400;
  margin-left: 5px;
  font-size: 14px;
  color: var(--muted);
}
.calibration-success {
  font-size: 14px;
  line-height: 1.7;
  padding: 10px;
  border-radius: 7px;
  color: #008d81;
  background: #008d810c;
}
.calibration-results > .secondary {
  border-color: #397ef0;
  color: #397ef0;
  background: transparent;
}
.dark .calibration-flow .complete > span,
.dark .calibration-result-icon.complete {
  background: #163f38;
  color: #9cdec9;
}
.dark .calibration-success {
  color: #9cdec9;
  background: #008d8118;
}
.system-info-trigger {
  font-size: 14px;

}

  height: 30px;

}

}

}

.process-node.animated {

.file-packet.animated {

}
.coordinate-dot.animated {

@keyframes processPulse {
  50% {
    opacity: 0.35;
  }
}
@keyframes processTravel {
  to {
    transform: translateX(236px);
  }
}
@keyframes fileTravel {
  to {
    transform: translateX(123px);
  }
}
@keyframes coordinateTravel {
  50%,
  100% {
    transform: translate(164px, 0);
  }
}
@keyframes trajectoryTravel {
  to {
    offset-distance: 100%;
  }
}
@keyframes processShimmer {
  to {
    background-position: -200% 0;
  }
}
@keyframes homeScan {
  65%,
  100% {
    transform: translateX(100%);
  }
}
