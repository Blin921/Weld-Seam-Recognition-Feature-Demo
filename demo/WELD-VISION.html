<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="WELD VISION 离线交互演示，内置合成数据，无需安装或联网。">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src blob:; base-uri 'none'; form-action 'none'">
<title>WELD VISION · 离线演示</title>
<style>:root {
  font-family: Arial, "Microsoft YaHei", sans-serif;
  color: #26354b;
  background: #f3f5f9;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
a {
  color: inherit;
  text-decoration: none;
}
input,
textarea,
select {
  border: 1px solid #dce2eb;
  border-radius: 6px;
  padding: 8px;
  background: var(--surface);
  color: inherit;
  min-width: 0;
}
input[type="checkbox"] {
  accent-color: #3478f6;
  width: 17px;
  height: 17px;
}
input[type="range"] {
  accent-color: #4a8af8;
  padding: 0;
}
textarea {
  width: 100%;
  font-family: monospace;
}
button:focus-visible,
a:focus-visible {
  outline: 2px solid #3981ff;
}
.workstation {
  --surface: #fff;
  --muted: #7c8a9e;
  --line: #e7ecf3;
  --soft: #f7f9fc;
  background: #f3f5f9;
  min-width: 1000px;
  min-height: 100vh;
}
.dark {
  --surface: #182332;
  --muted: #95a5ba;
  --line: #2b3b50;
  --soft: #1c293a;
  background: #101923 !important;
  color: #e0e8f4;
}
header {
  height: 78px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 28px;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 1px;
}
.brand-icon {
  background: #2c72ef;
  border-radius: 10px;
  color: white;
  padding: 10px;
  display: flex;
}
.brand span {
  color: #3179ef;
  margin-left: 4px;
}
.brand small {
  display: block;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--muted);
  margin-top: 5px;
}
.workspace-name {
  border-left: 1px solid var(--line);
  padding-left: 26px;
  font-size: 13px;
  color: var(--muted);
}
.workspace-name span {
  padding: 0 12px;
  color: #c3ccd8;
}
.health {
  margin-left: auto;
  display: flex;
  gap: 9px;
  font-size: 12px;
}
.health > span {
  padding: 7px 10px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--soft);
}
i {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.ok {
  color: #149c79;
}
.warn {
  color: #c58b29;
}
.danger {
  color: #d76161;
}
.icon-button {
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex;
}
.page-heading {
  padding: 27px 28px 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2px;
  color: #8494aa;
  font-weight: 600;
}
h1 {
  font-size: 25px;
  margin: 8px 0 9px;
}
h1 span {
  font-size: 11px;
  color: #357aeb;
  background: #e6eefc;
  border: 1px solid #d5e3fc;
  border-radius: 4px;
  margin-left: 10px;
  padding: 3px 6px;
  vertical-align: middle;
  font-weight: 400;
}
.page-heading p {
  color: var(--muted);
  margin: 0;
  font-size: 13px;
}
.safety-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #698098;
  font-size: 12px;
  padding: 10px 14px;
  border: 1px solid #dce5ee;
  border-radius: 7px;
}
.steps {
  display: flex;
  margin: 0 28px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 18px;
}
.steps > button {
  flex: 1;
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--muted);
  padding: 7px;
}
.step-number {
  font: 12px monospace;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
}
.steps .active {
  color: #2873ed;
  font-weight: 600;
}
.active .step-number {
  color: white;
  background: #347cf3;
  border-color: #347cf3;
}
.step-line {
  height: 1px;
  background: var(--line);
  flex: 1;
  margin: 0 12px;
}
.steps button:last-child .step-line {
  display: none;
}
.steps b {
  font-size: 10px;
  background: #fff1d7;
  color: #bb862b;
  padding: 1px 5px;
  border-radius: 50%;
}
.panels {
  margin: 0 28px;
  display: grid;
  grid-template-columns: 320px minmax(600px, 1fr) 300px;
  gap: 16px;
  height: 640px;
}
.control-panel,
.context-panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.panel-title {
  min-height: 51px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.panel-title > svg {
  color: #3c7fea;
}
.panel-title > span {
  margin-left: auto;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  font-weight: 400;
}
.control-content {
  padding: 18px;
  overflow: auto;
  flex: 1;
}
.context-content {
  padding: 18px;
  overflow: auto;
}
.panel-bottom {
  padding: 13px 16px;
  background: var(--soft);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted);
  display: flex;
  gap: 7px;
  align-items: center;
}
h3 {
  font-size: 14px;
  margin: 0 0 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}
h3 > span {
  font-size: 10px;
  font-weight: 400;
  margin-left: auto;
  color: var(--muted);
}
.upload {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  padding: 20px;
  border: 1px dashed #afc9f0;
  background: var(--soft);
  border-radius: 7px;
  color: #4681db;
  cursor: pointer;
}
.upload strong {
  font-size: 13px;
  font-weight: 500;
}
.upload small {
  font-size: 11px;
  color: var(--muted);
}
.upload input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  cursor: pointer;
}
.frame-list {
  margin-top: 13px;
  max-height: 180px;
  overflow: auto;
}
.frame-list > button {
  display: flex;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px 9px;
  gap: 9px;
  align-items: center;
  margin-bottom: 7px;
}
.frame-list > button.chosen {
  border-color: #659df9;
  background: #347cf30b;
}
.frame-list strong {
  font: 13px monospace;
}
.frame-list small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}
.artifact {
  margin-left: auto;
  color: #249a79;
  background: #22b38913;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
}
.section-divider {
  border-top: 1px solid var(--line);
  margin: 20px 0;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  margin: 15px 0;
}
.toggle-row small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 6px;
}
details {
  font-size: 12px;
}
summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 10px 0;
  color: var(--muted);
}
summary > svg:last-child {
  margin-left: auto;
}
.full {
  width: 100%;
  justify-content: center;
  margin-top: 12px;
}
.primary,
.secondary {
  border-radius: 6px;
  padding: 11px 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary {
  background: #347af0;
  color: white;
}
.secondary {
  border: 1px solid var(--line);
  background: var(--soft);
}
.camera {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 10px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 9px;
  margin: 12px 0;
}
.fields label {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}
.fields input {
  width: 100%;
  color: inherit;
  font-family: monospace;
}
.fields input[type="checkbox"] {
  width: 17px;
}
.help {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}
.info-box,
.warning {
  font-size: 14px;
  line-height: 1.8;
  border: 1px solid #dce7f5;
  background: var(--soft);
  padding: 12px;
  border-radius: 7px;
  margin: 12px 0;
}
.warning {
  border-color: #eedcb6;
  background: #f9b63912;
  color: #bc8428;
}
.danger-box {
  color: #da6262;
  border-color: #d963633d;
  background: #d963630a;
}
.text-danger {
  color: #d96363;
  padding: 12px 0;
}
.pair-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 9px 0 16px;
}
.pair-grid input {
  width: 100%;
  padding: 7px;
}
.pair-list h4 {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}
.pair-list h4 button {
  font-size: 11px;
  color: #cb7373;
}
.pair-list small {
  font-size: 10px;
  color: var(--muted);
}
.code-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  align-items: center;
}
.code-header a {
  display: flex;
  gap: 4px;
  color: #3a7de8;
}
.program-code {
  background: #101923;
  color: #b3c9df;
  padding: 12px;
  overflow: auto;
  max-height: 240px;
  font-size: 11px;
}
.viewport {
  border-radius: 9px;
  position: relative;
  overflow: hidden;
  background: #0d1218;
  color: #a6b6c8;
  min-width: 600px;
  border: 1px solid #24303d;
}
.view-toolbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  background: #121a24e0;
  border-bottom: 1px solid #273341;
}
.view-toolbar > div:first-child {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  color: #647b8e;
}
.view-toolbar strong {
  color: #dce6f2;
  font-size: 14px;
  font-weight: 500;
  margin-right: 9px;
}
.live-dot {
  width: 5px;
  height: 5px;
  background: #2ca893;
  border-radius: 50%;
}
.view-switch {
  background: #0b121c;
  border: 1px solid #283441;
  border-radius: 5px;
  padding: 3px;
  display: flex;
}
.view-switch button {
  padding: 5px 13px;
  font-size: 12px;
  color: #7e91a6;
  border-radius: 3px;
}
.view-switch .active {
  background: #29384b;
  color: #dae6f7;
}
.cloud-canvas {
  position: absolute;
  inset: 52px 0 32px;
}
.cloud-canvas[data-error]:after {
  content: attr(data-error);
  position: absolute;
  top: 50%;
  left: 20px;
  color: #eaa;
}
.cloud-canvas canvas {
  display: block;
}
.viewport-empty {
  pointer-events: none;
  position: absolute;
  inset: 52px 0 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #18283c66, transparent 65%);
}
.empty-orbit {
  color: #678fc2;
  border: 1px solid #344960;
  border-radius: 50%;
  padding: 32px;
  box-shadow:
    0 0 0 25px #24334620,
    0 0 0 50px #2433460c;
  margin-bottom: 30px;
}
.viewport-empty h2 {
  font-size: 18px;
  font-weight: 400;
  color: #c6d3e4;
}
.viewport-empty p {
  font-size: 14px;
  color: #6c8098;
}
.viewport-empty > span {
  font: 9px monospace;
  letter-spacing: 2px;
  margin-top: 18px;
  color: #41576f;
}
.view-controls {
  position: absolute;
  top: 67px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
}
.view-controls label {
  display: flex;
  gap: 7px;
  align-items: center;
  background: #15202be0;
  padding: 7px;
  border: 1px solid #283848;
  border-radius: 4px;
}
.view-controls input {
  width: 60px;
}
.view-controls button {
  display: flex;
  gap: 5px;
  padding: 8px;
  background: #15202be0;
  border: 1px solid #283848;
  border-radius: 4px;
}
.legend {
  position: absolute;
  bottom: 48px;
  left: 19px;
  display: flex;
  gap: 15px;
  font-size: 14px;
}
.legend span {
  display: flex;
  gap: 5px;
  align-items: center;
}
.legend i {
  border-radius: 2px;
}
.view-status {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 32px;
  border-top: 1px solid #273341;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 14px;
  font: 10px monospace;
  background: #101923;
}
.view-status span:first-child {
  color: #92b6e6;
}
.context-summary {
  display: flex;
  background: var(--soft);
  padding: 17px 12px;
  border-radius: 7px;
  gap: 15px;
  margin-bottom: 23px;
}
.context-summary > div {
  flex: 1;
}
.context-summary > div + div {
  border-left: 1px solid var(--line);
  padding-left: 15px;
}
.context-summary strong {
  font: 23px monospace;
}
.context-summary em {
  font-size: 10px;
  font-style: normal;
  color: var(--muted);
}
.context-summary small {
  display: block;
  font-size: 14px;
  color: var(--muted);
  margin-top: 6px;
}
.seam-card {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 12px;
  margin-bottom: 10px;
}
.seam-card.selected {
  border-color: #6fa2f9;
  background: #347cf308;
}
.seam-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 0;
  font-size: 14px;
}
.seam-title > span {
  display: flex;
  gap: 7px;
  align-items: center;
}
.seam-title i {
  color: #2bbdc5;
}
.selected .seam-title i {
  color: #e4af44;
}
.seam-title strong {
  font: 12px monospace;
}
.seam-title small {
  font-size: 9px;
  color: var(--muted);
}
.seam-card p {
  font-size: 14px;
  color: var(--muted);
  margin: 10px 0;
}
.seam-card p span {
  margin: 0 6px;
}
.seam-actions {
  display: flex;
  border-top: 1px solid var(--line);
  padding-top: 9px;
  justify-content: space-between;
}
.seam-actions button {
  font-size: 12px;
  color: #4e82d5;
  padding: 0 4px;
}
.empty-small {
  font-size: 14px;
  line-height: 1.9;
  color: var(--muted);
  padding: 16px 4px;
}
.context-panel dl {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  font-size: 14px;
  margin: 20px 0;
}
.context-panel dt {
  color: var(--muted);
}
.context-panel dd {
  margin: 0;
  text-align: right;
  font-family: monospace;
}
.tip {
  display: flex;
  gap: 9px;
  background: var(--soft);
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: #5484c6;
  margin-top: 25px;
}
.tip svg {
  flex-shrink: 0;
}
.tip p {
  font-size: 14px;
  margin: 0;
}
.tip small {
  display: block;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.8;
  margin-top: 7px;
}
.playback {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 16px 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 15px 18px;
}
.playback > div {
  display: flex;
  align-items: center;
  gap: 9px;
}
.playback strong {
  font-size: 14px;
  white-space: nowrap;
}
.playback span {
  font-size: 12px;
  color: var(--muted);
  margin: 0 15px 0 5px;
}
.playback > button {
  display: flex;
  align-items: center;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 5px;
}
.playback > input {
  flex: 1;
}
.playback code {
  font-size: 11px;
  color: var(--muted);
  min-width: 115px;
}
.playback select {
  padding: 5px;
  font-size: 11px;
}
.task-drawer {
  margin: 0 28px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.drawer-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 14px 18px;
  text-align: left;
}
.drawer-heading strong {
  font-size: 14px;
}
.drawer-heading span {
  font-size: 14px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 14px;
}
.drawer-heading small {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}
.task-body {
  height: 190px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 300px 1fr;
  background: #111a25;
  color: #869bb4;
}
.task-history {
  padding: 14px 18px;
  overflow: auto;
  border-right: 1px solid #293545;
  font-size: 14px;
}
.task-history pre {
  white-space: pre-wrap;
  font: 12px monospace;
  line-height: 1.7;
}
.task-history summary span {
  margin-left: auto;
}
.event-log {
  white-space: pre-wrap;
  overflow: auto;
  margin: 0;
  padding: 18px;
  font: 12px/1.9 monospace;
}
footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 30px;
  font-size: 11px;
  color: #8c9bad;
}
footer span:first-child {
  display: flex;
  align-items: center;
  gap: 6px;
}
footer i {
  color: #39a58c;
}
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 700px;
  padding: 15px 20px;
  background: #1b2e46;
  color: white;
  border: 1px solid #496180;
  box-shadow: 0 8px 35px #0003;
  border-radius: 8px;
  z-index: 20;
  font-size: 14px;
  line-height: 1.6;
}
.toast button {
  margin-left: 15px;
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: #07101bb0;
  z-index: 30;
  display: grid;
  place-items: center;
  backdrop-filter: blur(5px);
}
.modal {
  background: var(--surface);
  padding: 30px;
  border-radius: 13px;
  width: 440px;
  border: 1px solid var(--line);
}
.modal > svg {
  color: #d59635;
}
.modal h2 {
  font-size: 20px;
}
.modal p {

  gap: 14px;
  list-style: none;
  margin: 0 0 20px;
  padding: 0;
}
.architecture-cards li {
  padding: 18px;
  background: #f5f8fc;
  border: 1px solid #e4ebf4;
  border-radius: 10px;
}
.architecture-cards svg {
  display: block;
  color: #347af0;
  margin-bottom: 12px;
}
.architecture-cards small {
  display: block;
  font-size: 14px;
  color: #61758e;
  margin-bottom: 8px;
}
.architecture-cards h3 {
  font-size: 16px;
}
.architecture-cards p {
  font-size: 14px;
  color: #61758e;
  margin: 0;
  line-height: 1.8;
}
.info-device-row {
  display: flex;
  gap: 12px;
  padding: 16px;
  border: 1px solid #e4ebf4;
  border-radius: 10px;
  margin: 0 0 16px;
}
.info-device-row svg {
  flex-shrink: 0;
  color: #347af0;
}
.info-device-row p {
  margin: 0;
  color: #61758e;
}
.info-callout {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding: 16px;
  background: #eaf6f2;
  border: 1px solid #cde8df;
  border-radius: 10px;
  color: #007b71;
  margin: 16px 0;
}
.info-callout > p {
  flex-basis: 100%;
}
.info-callout p {
  margin: 6px 0 0;
  font-size: 14px;
  line-height: 1.8;
}
.info-callout svg {
  flex-shrink: 0;
}
.info-callout > div {
  flex: 1;
  min-width: 180px;
}
.info-footnote {
  font-size: 14px;
  color: #61758e;
  margin: 16px 0 4px;
}
.info-capabilities {
  margin: 0 0 22px;
  padding-left: 22px;
  color: #536b86;
}
.info-capabilities li {
  padding: 4px 0;
}
.info-modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.info-modes section {
  padding: 18px;
  border: 1px solid #e4ebf4;
  border-radius: 10px;
}
.info-modes p {
  color: #61758e;
  margin: 0;
}
.system-info-actions {
  position: sticky;
  bottom: 0;
  background: var(--surface, #fff);
  border-top: 1px solid #e6ecf3;
  padding: 12px 28px;
  display: flex;
  justify-content: flex-end;
}
.system-info-actions button {
  min-width: 100px;
}
@media (max-width: 650px) {
  .architecture-cards,
  .info-modes {
    grid-template-columns: 1fr;
  }
  .system-info-heading {
    padding: 18px;
  }
  .system-info-body {
    padding: 18px;
  }
  .system-info-actions {
    padding: 12px 18px 18px;
  }
}
/* Full dark palette takes precedence over the shared light workspace defaults. */
.workstation.dark {
  --surface: #172332;
  --soft: #202e40;
  --line: #304156;
  --muted: #a5b5c9;
  background: #101923;
  color: #e2eaf4;
  color-scheme: dark;
}
.workstation.dark .workspace-topbar,
.workstation.dark > .status-strip,
.workstation.dark .viewport,
.workstation.dark .view-toolbar,
.workstation.dark .control-panel,
.workstation.dark .context-panel,
.workstation.dark .playback,
.workstation.dark .task-drawer {
  background: var(--surface);
  color: #e2eaf4;
}
.workstation.dark .workspace-brand,
.workstation.dark .workspace-topbar h1,
.workstation.dark .panel-title,
.workstation.dark .view-toolbar strong,
.workstation.dark .calibration-results h2 {
  color: #e2eaf4;
}
.workstation.dark .fields input,
.workstation.dark .pair-grid input,
.workstation.dark textarea,
.workstation.dark select,
.workstation.dark .upload,
.workstation.dark .frame-list > button,
.workstation.dark .transfer-file,
.workstation.dark .info-box,
.workstation.dark .calibration-metric,
.workstation.dark .view-switch,
.workstation.dark .tip {
  background: var(--soft);
  color: #d9e5f3;
  border-color: var(--line);
}
.workstation.dark .frame-list > button.chosen {
  background: #213b57;
  border-color: #477dc5;
}
.workstation.dark .frame-list strong,
.workstation.dark .upload strong,
.workstation.dark .fields label,
.workstation.dark .context-content > p,
.workstation.dark .view-controls label,
.workstation.dark .view-controls button,
.workstation.dark .legend,
.workstation.dark .view-status,
.workstation.dark .view-switch button {
  color: #b7c7dc;
}
.workstation.dark input::placeholder,
.workstation.dark textarea::placeholder {
  color: #899cb2;
}
.workstation.dark .view-switch .active,
.workstation.dark .view-switch .focus-toggle {
  background: #27486a;
  color: #dcecff;
}
.workstation.dark .calibration-flow .current > span {
  background: #397ce6;
  color: white;
}
.workstation.dark .calibration-flow .needs-review > span,
.workstation.dark .calibration-result-icon.needs-review {
  background: #493b25;
  color: #f0c77e;
}
.workstation.dark .calibration-result-icon.pending {
  background: var(--soft);
  color: #96acc5;
}
.workstation.dark .compact-tabs [aria-selected="true"] {
  background: #27486a;
  color: #c5ddff;
}
.workstation.dark .seam-card.selected .seam-title {
  color: #6fd9cb;
}
.workstation.dark .seam-actions button,
.workstation.dark .steps .active,
.workstation.dark .code-header a,
.workstation.dark .calibration-results > .secondary {
  color: #8bbcff;
}
.workstation.dark .steps > button,
.workstation.dark .steps > a {
  color: #adbed3;
}
.workstation.dark .steps .active {
  color: #75d6c8;
}
.workstation.dark .step-warning {
  background: #493b25;
  color: #f0c77e;
}
.workstation.dark .health .ok {
  color: #5ed1a4;
}
.workstation.dark .health .warn {
  color: #ecc27d;
}
.workstation.dark .health .danger {
  color: #f29797;
}
.workstation.dark .teal-heading {
  color: #6fd9cb;
}
.workstation.dark .warning {
  background: #352c21;
  color: #ecc27d;
  border-color: #6d542d;
}
.workstation.dark .danger-box {
  background: #38252c;
  color: #f3a3aa;
  border-color: #70404c;
}
.workstation.dark .task-body {
  background: #111b28;
  color: #b7c7dc;
}
.workstation.dark .task-history {
  border-color: var(--line);
}
.workstation.dark .task-history summary,
.workstation.dark .event-log {
  color: #b7c7dc;
}
.workstation .theme-toggle {
  min-width: 32px;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  background: #e9f0fa;
  color: #315f9a;
  border: 1px solid #d0def0;
}
.workstation.dark .theme-toggle {
  background: #29394e;
  color: #ffd77a;
  border: 1px solid #53677f;
}
.theme-toggle svg {
  stroke: currentColor;
  opacity: 1;
  flex-shrink: 0;
}
.workstation.dark button:focus-visible,
.workstation.dark a:focus-visible {
  outline-color: #9cc6ff;
}
.workstation.dark .viewport-empty h2 {
  color: #d7e4f4;
}
.workstation.dark .viewport-empty p,
.workstation.dark .view-toolbar > div:first-child {
  color: #a5b5c9;
}
.workstation.dark .empty-orbit {
  border-color: #34485e;
  color: #83a5ce;
}
.workstation.dark .source-demo,
.workstation.dark .artifact {
  background: #1c4542;
  color: #89dbc9;
}
.workstation.dark .exit-demo {
  color: #8ddccf;
}
.workstation.dark .program-code {
  border: 1px solid var(--line);
}
